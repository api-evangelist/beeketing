generated: '2026-08-13'
method: searched
source: https://registry.npmjs.org/ (npm registry metadata) + https://developers.shopbase.com/build-a-theme/theme-development-resources.md
docs: https://developers.shopbase.com/build-a-theme/theme-development-resources.md
notes: >-
  ShopBase (OpenCommerce Group, formerly Beeketing) publishes no server-side API
  client SDK on any public registry. The only first-party packages found are the
  npm `@shopbase-theme/*` and `@shopbase-internal-theme/*` scopes, published by
  the npm user `shopbase`, which ship the theme-development CLI and one storefront
  Vue component. PyPI, RubyGems, Packagist, crates.io, NuGet, Maven Central and
  pkg.go.dev were searched for shopbase / beeketing / opencommerce and returned no
  first-party client. The GitHub org github.com/Beeketing (205 repos) is almost
  entirely forks of third-party Go libraries; github.com/ShopBaseCom holds 4
  first-party repos (starter theme, gateway demo, AsiaBill gateway SDK) and none
  are published to a package registry.
decay_signal: >-
  Every first-party package is stale. The publicly documented CLI
  (@shopbase-theme/cli) last published 2019-11-04 — six and a half years before
  this probe — while the REST Admin API it accompanies is still served. The
  internal-theme fork was last published 2021-08-04. There is no versioned,
  maintained client for the 153-operation Admin API at all.
