- aid: beeketing:beeketing-collect-api
  name: Beeketing Collect API
  description: >-
    The Collect resource connects a product to a custom collection. </br></br>Collects are meant for managing
    the relationship between products and custom collections. For every product in a custom collection
    there is a collect that tracks the ID of both the product and the custom collection. A product can
    be in more than one collection, and will have a collect connecting it to each collection. Unlike many
    ShopBase resources, collects aren't apparent to store owners. </br></br>Collects are for placing products
    in custom collections only. Smart collections use rules to determine which products are their members
  humanURL: https://developers.shopbase.com
  baseURL: https://{shop}.onshopbase.com/admin
