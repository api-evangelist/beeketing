- aid: beeketing:beeketing-refund-api
  name: Beeketing Refund API
  description: >-
    There are two major parts to a refund:</br>- A record of money returned to the customer</br>- The
    line items included in the refund, along with restocking instructions</br></br>Before you create a
    refund, use the calculate endpoint to generate accurate refund transactions. Specify the line items
    that are being refunded, their quantity and restock instructions, and whether you're refunding shipping
    costs. You can then use the response in the body of the request to create the actual refund.</br></br>When
    you create a refund using the response from the calculate endpoint, you can set additional options,
