name: Beeketing
description: >-
  Beeketing began as a Vietnam-founded e-commerce marketing startup (backed by
  500 Global) that built conversion-optimization apps for Shopify and other
  online stores, and evolved into OpenCommerce Group — the operator of ShopBase,
  a cross-border commerce platform serving 100,000+ merchants across 195
  countries alongside PrintBase and PlusBase. The developer surface is the
  ShopBase Developer Platform: a Shopify-style REST Admin API (plus a GraphQL
  Admin API) for building public and private apps, themes, and payment gateways.
  It is secured with OAuth 2.0 authorization-code flow (public apps) or HTTP
  Basic auth (private apps), scoped with granular access scopes, and supports
  webhooks, leaky-bucket rate limiting, an app/theme store, and a Storefront SDK.
